<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Figtree', system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#1D4E89; text-decoration:none; } a:hover { color:#143761; }
    h1,h2,h3 { font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif; margin:0; letter-spacing:-0.022em; line-height:1.14; }
    button { font-family:inherit; border:none; background:none; padding:0; margin:0; color:inherit; cursor:pointer; text-align:left; }
    .scroll::-webkit-scrollbar { width:0; }
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F4EF;color:#14202E;overflow:hidden">

  <div style="flex-shrink:0;padding:16px 16px 12px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <h2 style="font-size:26px">People</h2>
      <button style="height:44px;padding:0 4px;border-radius:14px;color:#1D4E89;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D4E89" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        New BGroup
      </button>
    </div>
    <div style="display:flex;gap:6px;margin-top:14px;background:#EDE8DF;border-radius:16px;padding:4px">
      <button style="flex-grow:1;height:46px;border-radius:13px;background:transparent;color:#8B7B63;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">People</button>
      <button style="flex-grow:1;height:46px;border-radius:13px;background:#FFFFFF;color:#1D4E89;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">Groups</button>
    </div>
  </div>

  <div class="scroll" style="flex-grow:1;min-height:0;overflow-y:auto;padding:0 16px 20px">

    <div style="display:flex;flex-direction:column;gap:11px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <button onClick="{{g.toggle}}" style="display:block;width:100%;background:#FFFFFF;border:1.5px solid {{g.border}};border-radius:22px;padding:16px">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="flex-grow:1;min-width:0">
              <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.02em">{{g.name}}</div>
              <div style="font-size:13.5px;color:#61708A;margin-top:3px">{{g.schedule}}</div>
            </div>
            <span style="font-size:12px;font-weight:700;color:{{g.pillInk}};background:{{g.pillBg}};border-radius:9px;padding:5px 9px;flex-shrink:0">{{g.members}}</span>
          </div>

          <div style="margin-top:14px;background:#FBF9F5;border-radius:16px;padding:12px 13px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
              <span style="font-size:14.5px;font-weight:700;min-width:0">{{g.book}}</span>
              <span style="font-size:12.5px;font-weight:700;color:#8B7B63;flex-shrink:0">{{g.covered}}</span>
            </div>
            <div style="display:flex;gap:5px;margin-top:10px">
              <sc-for list="{{g.dots}}" as="d" hint-placeholder-count="6">
                <div style="flex-grow:1;height:7px;border-radius:4px;background:{{d.bg}}"></div>
              </sc-for>
            </div>
          </div>

          <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
            <div style="margin-top:13px;display:flex;flex-direction:column;gap:9px">
              <sc-for list="{{g.people}}" as="p" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="width:34px;height:34px;border-radius:12px;background:{{p.bg}};color:{{p.ink}};display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0">{{p.initials}}</div>
                  <span style="flex-grow:1;min-width:0;font-size:14.5px;font-weight:600">{{p.name}}</span>
                  <span style="font-size:12.5px;font-weight:700;color:{{p.ink}};flex-shrink:0">{{p.progress}}</span>
                </div>
              </sc-for>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px;height:48px;padding:0 16px;border-radius:14px;background:#1D4E89;color:#FFFFFF;font-size:15px;font-weight:700;justify-content:center">Open group</div>
            </div>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:9px;margin:26px 0 11px">
      <h3 style="font-size:15px;color:#8B7B63">Archived</h3>
      <div style="flex-grow:1;height:1px;background:#E6DFD4"></div>
    </div>

    <div style="background:#F1EDE5;border-radius:20px;padding:15px 16px">
      <div style="display:flex;align-items:center;gap:11px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8B7B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="4" width="18" height="5" rx="2"></rect><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"></path></svg>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:15px;font-weight:700;color:#61708A">Wednesday Couples</div>
          <div style="font-size:13px;color:#8B7B63;margin-top:2px">Finished Family Life · archived 12 May · 8 members moved</div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'tue' };
  }
  renderVals() {
    const DATA = [
      { id: 'tue', name: 'Tuesday BGroup', schedule: 'Tuesdays 7:00 PM · at home', members: '6', book: 'Book 1 — One By One', done: 3, of: 6,
        people: [
          { initials: 'MS', name: 'Maria Santos', progress: '3 of 6', tone: 'blue' },
          { initials: 'BC', name: 'Ben Cruz', progress: '3 of 6', tone: 'blue' },
          { initials: 'NV', name: 'Nena Villamor', progress: '3 of 6', tone: 'amber' },
          { initials: 'JR', name: 'Joel Ramos', progress: '4 of 6', tone: 'blue' }
        ] },
      { id: 'sun', name: 'Sunday Youth', schedule: 'Sundays 4:00 PM · church annex', members: '9', book: 'Book 2 — Spiritual Disciplines', done: 1, of: 6,
        people: [
          { initials: 'DU', name: 'Divine Uy', progress: '2 of 6', tone: 'blue' },
          { initials: 'GB', name: 'Grace Bautista', progress: '1 of 6', tone: 'amber' }
        ] },
      { id: 'lead', name: 'Leaders in training', schedule: 'Saturdays 9:00 AM · online', members: '4', book: 'Book 5 — DGroup 101', done: 2, of: 4,
        people: [
          { initials: 'AM', name: 'Ptr. Ariel Mendoza', progress: '2 of 4', tone: 'blue' }
        ] }
    ];

    const groups = DATA.map((g) => {
      const open = this.state.open === g.id;
      const dots = [];
      for (let i = 0; i < g.of; i++) dots.push({ bg: i < g.done ? '#1D4E89' : '#E0D9CC' });
      return {
        name: g.name,
        schedule: g.schedule,
        members: g.members + ' members',
        book: g.book,
        covered: g.done + ' of ' + g.of + ' covered',
        dots: dots,
        open: open,
        border: open ? '#1D4E89' : '#E6DFD4',
        pillBg: open ? '#E7EFF9' : '#F1EDE5',
        pillInk: open ? '#143761' : '#8B7B63',
        people: g.people.map((p) => ({
          initials: p.initials, name: p.name, progress: p.progress,
          bg: p.tone === 'amber' ? '#FBF0DC' : '#E7EFF9',
          ink: p.tone === 'amber' ? '#9A5B0B' : '#1D4E89'
        })),
        toggle: () => this.setState({ open: open ? null : g.id })
      };
    });

    return { groups: groups };
  }
}
</script>
</body>
</html>
