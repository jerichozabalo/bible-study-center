<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Figtree', system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#1D4E89; text-decoration:none; } a:hover { color:#143761; }
    h1,h2,h3 { font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif; margin:0; letter-spacing:-0.022em; line-height:1.14; }
    button { font-family:inherit; border:none; background:none; padding:0; margin:0; color:inherit; cursor:pointer; text-align:left; }
    .scroll::-webkit-scrollbar { width:0; }
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F7F4EF;color:#14202E;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:30px;height:30px;border-radius:10px;background:#1D4E89;display:flex;align-items:center;justify-content:center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5"></path></svg>
      </div>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.015em">Bible Study Tayo</span>
    </div>
    <button style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#61708A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.45.6.83.71H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div class="scroll" style="flex-grow:1;min-height:0;overflow-y:auto;padding:6px 16px 20px">

    <div style="font-size:13px;font-weight:600;color:#8B7B63;letter-spacing:0.06em;margin-bottom:12px">TUESDAY, 19 AUGUST</div>

    <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
      <div style="background:#1D4E89;border-radius:24px;padding:20px;color:#FFFFFF">
        <div style="display:flex;align-items:center;gap:7px">
          <div style="width:7px;height:7px;border-radius:4px;background:#7FC4A0"></div>
          <span style="font-size:11px;font-weight:700;letter-spacing:0.13em;color:#A9C6E8">NEXT MEETING &middot; TONIGHT</span>
        </div>
        <h2 style="font-size:27px;margin-top:9px;color:#FFFFFF">Tuesday BGroup</h2>
        <div style="font-size:15px;color:#C4D9F0;margin-top:5px">7:00 PM &middot; 6 members</div>
        <div style="margin-top:15px;background:rgba(255,255,255,0.13);border-radius:16px;padding:13px 15px">
          <div style="font-size:10px;font-weight:700;letter-spacing:0.13em;color:#A9C6E8">COVERING</div>
          <div style="font-size:16px;font-weight:700;margin-top:4px">Book 1 &middot; Session 4</div>
          <div style="font-size:14px;color:#C4D9F0;margin-top:1px">One Promise &mdash; The Assurance of Salvation</div>
        </div>
        <button style="margin-top:16px;width:100%;height:58px;border-radius:18px;background:#FFFFFF;color:#143761;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#143761" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          Mark attendance
        </button>
        <button onClick="{{cancel}}" style="margin-top:6px;width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#A9C6E8">Didn&#39;t meet tonight</button>
      </div>
    </sc-if>

    <sc-if value="{{cancelled}}" hint-placeholder-val="{{false}}">
      <div style="background:#FFFFFF;border:1px solid #E6DFD4;border-radius:24px;padding:20px">
        <div style="display:flex;align-items:center;gap:9px">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8B7B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m15 9-6 6M9 9l6 6"></path></svg>
          <span style="font-size:15px;font-weight:600;color:#61708A">Tuesday BGroup &mdash; cancelled</span>
        </div>
        <div style="font-size:14px;color:#8B7B63;margin-top:6px;line-height:1.45">Not counted as held. Next meeting stays Tuesday, 26 August.</div>
        <button onClick="{{undo}}" style="margin-top:14px;height:48px;padding:0 20px;border-radius:14px;border:1.5px solid #1D4E89;color:#1D4E89;font-size:15px;font-weight:600;display:flex;align-items:center">Undo</button>
      </div>
    </sc-if>

    <div style="display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 11px">
      <h3 style="font-size:18px">Needs you</h3>
      <span style="font-size:13px;font-weight:600;color:#8B7B63">3</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
        <button onClick="{{item.toggle}}" style="display:block;width:100%;background:#FFFFFF;border:1px solid #E6DFD4;border-radius:20px;padding:14px 15px">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="width:38px;height:38px;border-radius:13px;background:{{item.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{item.tone}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.path}}"></path></svg>
            </div>
            <div style="flex-grow:1;min-width:0">
              <div style="font-size:15.5px;font-weight:700">{{item.name}}</div>
              <div style="font-size:14px;color:#61708A;margin-top:2px;line-height:1.4">{{item.detail}}</div>
              <sc-if value="{{item.open}}" hint-placeholder-val="{{true}}">
                <div style="display:flex;gap:8px;margin-top:13px">
                  <span style="height:46px;padding:0 17px;border-radius:14px;background:#1D4E89;color:#FFFFFF;font-size:14.5px;font-weight:600;display:flex;align-items:center">{{item.action}}</span>
                  <span style="height:46px;padding:0 17px;border-radius:14px;border:1.5px solid #E6DFD4;color:#61708A;font-size:14.5px;font-weight:600;display:flex;align-items:center">Later</span>
                </div>
              </sc-if>
            </div>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3B8A5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:9px"><path d="m9 18 6-6-6-6"></path></svg>
          </div>
        </button>
      </sc-for>
    </div>

  </div>

  <div style="flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;background:#FFFFFF;border-top:1px solid #E6DFD4;padding:9px 14px 18px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#1D4E89" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span style="font-size:11px;font-weight:700;color:#1D4E89">Home</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B7B63" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 11h18"></path></svg>
      <span style="font-size:11px;font-weight:600;color:#8B7B63">Calendar</span>
    </div>
    <div style="width:60px;display:flex;justify-content:center">
      <div style="width:58px;height:58px;border-radius:20px;background:#1D4E89;display:flex;align-items:center;justify-content:center;margin-bottom:4px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B7B63" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path></svg>
      <span style="font-size:11px;font-weight:600;color:#8B7B63">People</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:60px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8B7B63" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      <span style="font-size:11px;font-weight:600;color:#8B7B63">Reports</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: 'nena', cancelled: false };
  }
  renderVals() {
    const raw = [
      { id: 'nena', name: 'Nena Villamor', detail: 'Missed 3 meetings in a row. Last seen 28 July.', action: 'Send a message', tone: '#9A5B0B', bg: '#FBF0DC', path: 'M12 8v5M12 16.5v.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z' },
      { id: 'ben', name: 'Ben Cruz', detail: 'Catch-up: missing Session 3 and 4 of One By One.', action: 'Plan a makeup', tone: '#1D4E89', bg: '#E7EFF9', path: 'M12 21a9 9 0 1 0-9-9M12 7v5l3 2M3 12l-2-2m2 2 2-2' },
      { id: 'backup', name: 'Attendance waiting to upload', detail: '2 meetings ticked with no signal. Tuesday BGroup, 12 and 19 August.', action: 'Upload now', tone: '#61708A', bg: '#EDEAE3', path: 'M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2' }
    ];
    const items = raw.map((it) => ({
      ...it,
      open: this.state.expanded === it.id,
      toggle: () => this.setState({ expanded: this.state.expanded === it.id ? null : it.id })
    }));
    return {
      items,
      live: !this.state.cancelled,
      cancelled: this.state.cancelled,
      cancel: () => this.setState({ cancelled: true }),
      undo: () => this.setState({ cancelled: false })
    };
  }
}
</script>
</body>
</html>
